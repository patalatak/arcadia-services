<?xml version="1.0" encoding="UTF-8"?>
<!-- Arcadia — Robot de livraison en salle. Illustration vectorielle, sans dépendance externe. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 560" role="img" aria-label="Robot de livraison en salle">
    <style>
          /* Animations internes — désactivées si l'utilisateur limite les animations */
          @keyframes regard { 0%,88%,100%{opacity:1} 92%,96%{opacity:.25} }
          @keyframes pulseHalo { 0%,100%{opacity:.55} 50%{opacity:1} }
          @keyframes ondeA { 0%{opacity:.25} 30%{opacity:1} 70%{opacity:.25} 100%{opacity:.25} }
          circle[fill="#6ae4ff"]{ animation: regard 5.5s ease-in-out infinite; }
          ellipse[fill="url(#halo)"]{ animation: pulseHalo 6s ease-in-out infinite; }
          g[stroke="url(#onde)"] > path:nth-child(1){ animation: ondeA 2.8s ease-in-out infinite; }
          g[stroke="url(#onde)"] > path:nth-child(2){ animation: ondeA 2.8s ease-in-out .35s infinite; }
          g[stroke="url(#onde)"] > path:nth-child(3){ animation: ondeA 2.8s ease-in-out .7s infinite; }
          @media (prefers-reduced-motion: reduce){
            circle[fill="#6ae4ff"], ellipse[fill="url(#halo)"], g[stroke="url(#onde)"] > path{ animation:none; }
          }
    </style>
    <defs>
          <linearGradient id="corps" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#26355a"/><stop offset="100%" stop-color="#18223a"/>
          </linearGradient>
          <linearGradient id="ecran" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#2f66c4"/><stop offset="100%" stop-color="#1b3a70"/>
          </linearGradient>
          <linearGradient id="onde" x1="0" y1="1" x2="1" y2="0">
                  <stop offset="0%" stop-color="#1b46d8"/><stop offset="100%" stop-color="#6ae4ff"/>
          </linearGradient>
          <radialGradient id="halo" cx="50%" cy="50%" r="50%">
                  <stop offset="0%" stop-color="#6ae4ff" stop-opacity=".20"/>
                  <stop offset="100%" stop-color="#6ae4ff" stop-opacity="0"/>
          </radialGradient>
    </defs>
    <ellipse cx="230" cy="250" rx="190" ry="230" fill="url(#halo)"/>
    <ellipse cx="230" cy="520" rx="124" ry="14" fill="#6ae4ff" opacity=".14"/>
    <!-- base roulante -->
    <path d="M 160 424 H 300 l 28 58 a 16 16 0 0 1 -14 25 H 146 a 16 16 0 0 1 -14 -25 Z"
              fill="url(#corps)" stroke="#6ae4ff" stroke-width="3"/>
    <circle cx="176" cy="498" r="15" fill="#0f1a2e" stroke="#6ae4ff" stroke-width="3"/>
    <circle cx="284" cy="498" r="15" fill="#0f1a2e" stroke="#6ae4ff" stroke-width="3"/>
    <!-- colonne à plateaux -->
    <rect x="140" y="150" width="180" height="276" rx="22" fill="url(#corps)" stroke="#6ae4ff" stroke-width="3"/>
    <rect x="132" y="216" width="196" height="13" rx="6.5" fill="#0f1a2e" stroke="#6ae4ff" stroke-width="2.4"/>
    <rect x="132" y="310" width="196" height="13" rx="6.5" fill="#0f1a2e" stroke="#6ae4ff" stroke-width="2.4"/>
    <rect x="168" y="182" width="62" height="34" rx="6" fill="#16233f" stroke="#6ae4ff" stroke-width="2" opacity=".9"/>
    <rect x="242" y="192" width="48" height="24" rx="5" fill="#16233f" stroke="#6ae4ff" stroke-width="2" opacity=".9"/>
    <rect x="164" y="272" width="76" height="38" rx="6" fill="#16233f" stroke="#6ae4ff" stroke-width="2" opacity=".9"/>
    <rect x="252" y="284" width="44" height="26" rx="5" fill="#16233f" stroke="#6ae4ff" stroke-width="2" opacity=".9"/>
    <rect x="164" y="348" width="132" height="58" rx="10" fill="url(#ecran)" opacity=".95"/>
    <g fill="#bfe3ff" opacity=".9">
          <rect x="180" y="366" width="62" height="7" rx="3.5"/>
          <rect x="180" y="380" width="92" height="7" rx="3.5"/>
    </g>
    <circle cx="278" cy="388" r="8" fill="#6ae4ff"/>
    <!-- tête -->
    <rect x="204" y="118" width="52" height="32" fill="#1a2439" stroke="#6ae4ff" stroke-width="3"/>
    <rect x="142" y="36" width="176" height="86" rx="26" fill="url(#corps)" stroke="#6ae4ff" stroke-width="3"/>
    <rect x="162" y="54" width="136" height="52" rx="14" fill="url(#ecran)"/>
    <circle cx="202" cy="80" r="11" fill="#6ae4ff"/>
    <circle cx="258" cy="80" r="11" fill="#6ae4ff"/>
</svg>
